name: DeployToGitHubPages

env:
  PROJECT_PATH: src/Hywe.Web/Hywe.Web.fsproj
  PUBLISH_DIR: src/Hywe.Web/bin/Release/net10.0/publish
  REPO_API_URL: https://api.github.com/repos/vykrum/Hywe

on:
  push:
    branches: [main, updates]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Run Hywe.Core Tests
        run: dotnet test tests/Hywe.Core.Tests/Hywe.Core.Tests.fsproj --configuration Release

  build:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore workloads
        run: dotnet workload restore

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Ensure wasm-tools-net10 installed
        run: dotnet workload install wasm-tools-net10 --skip-manifest-update || true

      - name: Ensure publish dir
        run: mkdir -p ${{ env.PUBLISH_DIR }}/wwwroot

      - name: Sync LLM context files to wwwroot
        run: |
          cp llms.txt src/Hywe.Web/wwwroot/llms.txt
          cp llms-full.txt src/Hywe.Web/wwwroot/llms-full.txt

      - name: Generate sitemap and update modified timestamps
        run: |
          CURRENT_DATE=$(date -u +'%Y-%m-%d')
          CURRENT_DATETIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          echo '<?xml version="1.0" encoding="UTF-8"?>' > src/Hywe.Web/wwwroot/sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> src/Hywe.Web/wwwroot/sitemap.xml
          echo '  <url>' >> src/Hywe.Web/wwwroot/sitemap.xml
          echo '    <loc>https://hywe.in/</loc>' >> src/Hywe.Web/wwwroot/sitemap.xml
          echo "    <lastmod>${CURRENT_DATE}</lastmod>" >> src/Hywe.Web/wwwroot/sitemap.xml
          echo '  </url>' >> src/Hywe.Web/wwwroot/sitemap.xml
          echo '  <url>' >> src/Hywe.Web/wwwroot/sitemap.xml
          echo '    <loc>https://hywe.in/llms.txt</loc>' >> src/Hywe.Web/wwwroot/sitemap.xml
          echo "    <lastmod>${CURRENT_DATE}</lastmod>" >> src/Hywe.Web/wwwroot/sitemap.xml
          echo '  </url>' >> src/Hywe.Web/wwwroot/sitemap.xml
          echo '  <url>' >> src/Hywe.Web/wwwroot/sitemap.xml
          echo '    <loc>https://hywe.in/llms-full.txt</loc>' >> src/Hywe.Web/wwwroot/sitemap.xml
          echo "    <lastmod>${CURRENT_DATE}</lastmod>" >> src/Hywe.Web/wwwroot/sitemap.xml
          echo '  </url>' >> src/Hywe.Web/wwwroot/sitemap.xml
          echo '</urlset>' >> src/Hywe.Web/wwwroot/sitemap.xml

          sed -i -E "s/let MODIFIED_DATE = \".*\"/let MODIFIED_DATE = \"$CURRENT_DATETIME\"/g" src/Hywe.Web/Common/ModelTypes.fs
          sed -i -E "s/<meta property=\"article:modified_time\" content=\".*\" \/>/<meta property=\"article:modified_time\" content=\"$CURRENT_DATETIME\" \/>/g" src/Hywe.Web/wwwroot/index.html
          sed -i -E "s/\"dateModified\": \".*\"/\"dateModified\": \"$CURRENT_DATETIME\"/g" src/Hywe.Web/wwwroot/index.html
          sed -i -E "s/<meta property=\"article:published_time\" content=\".*\" \/>/<meta property=\"article:published_time\" content=\"$CURRENT_DATETIME\" \/>/g" docs/_template.html

      - name: Publish Bolero app (Release + Trimming + AOT for GH Pages)
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} -c Release \
            -p:BlazorEnableTimeZoneSupport=false \
            -p:RunAOTCompilation=true \
            -p:PublishTrimmed=true \
            -o ${{ env.PUBLISH_DIR }}

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build fsdocs documentation into wwwroot/api
        run: |
          dotnet build src/Hywe.Core/Hywe.Core.fsproj
          dotnet fsdocs build --clean --strict --eval --ignoreuncategorized \
            --projects src/Hywe.Core/Hywe.Core.fsproj \
            --sourcerepo https://github.com/vykrum/Hywe/tree/main \
            --parameters root https://hywe.in/api/ \
              fsdocs-license-link https://github.com/vykrum/Hywe/blob/main/LICENSE \
              fsdocs-release-notes-link https://github.com/vykrum/Hywe/blob/main/RELEASE_NOTES.md \
            --output ${{ env.PUBLISH_DIR }}/wwwroot/api

      - name: Set per-page canonical, og:url, and sitemap entries for API docs
        run: |
          python3 - <<'EOF'
          import os
          from datetime import datetime, timezone

          api_dir = os.path.join("${{ env.PUBLISH_DIR }}", "wwwroot", "api")
          sitemap_path = os.path.join("${{ env.PUBLISH_DIR }}", "wwwroot", "sitemap.xml")
          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          api_urls = []

          for root_dir, _, files in os.walk(api_dir):
              for f in sorted(files):
                  if not f.endswith(".html"):
                      continue
                  full_path = os.path.join(root_dir, f)
                  rel = os.path.relpath(full_path, api_dir).replace("\\", "/")
                  page_url = "https://hywe.in/api/" if rel == "index.html" else f"https://hywe.in/api/{rel}"

                  with open(full_path, "r", encoding="utf-8") as fh:
                      html = fh.read()

                  target = '<meta property="og:url" content="https://hywe.in/api/">'
                  replacement = f'<link rel="canonical" href="{page_url}" />\n    <meta property="og:url" content="{page_url}" />'
                  if target in html:
                      html = html.replace(target, replacement, 1)
                      with open(full_path, "w", encoding="utf-8") as fh:
                          fh.write(html)

                  if rel != "reference/index.html":
                      api_urls.append(page_url)

          if os.path.exists(sitemap_path) and api_urls:
              with open(sitemap_path, "r", encoding="utf-8") as fh:
                  sitemap = fh.read()
              entries = "\n".join(
                  f"  <url>\n    <loc>{u}</loc>\n    <lastmod>{today}</lastmod>\n  </url>"
                  for u in sorted(api_urls)
              )
              sitemap = sitemap.replace("</urlset>", f"{entries}\n</urlset>")
              with open(sitemap_path, "w", encoding="utf-8") as fh:
                  fh.write(sitemap)
          EOF

      - name: Clean up debug symbols (.pdb)
        run: find ${{ env.PUBLISH_DIR }}/wwwroot -name "*.pdb" -type f -delete

      - name: Rewrite base href
        uses: SteveSandersonMS/ghaction-rewrite-base-href@v1
        with:
          html_path: ${{ env.PUBLISH_DIR }}/wwwroot/index.html
          base_href: /

      - name: Create CNAME file
        run: echo 'hywe.in' > ${{ env.PUBLISH_DIR }}/wwwroot/CNAME

      - name: Ensure .nojekyll exists
        run: touch ${{ env.PUBLISH_DIR }}/wwwroot/.nojekyll

      - name: Compress WASM and DLL files
        run: |
          find ${{ env.PUBLISH_DIR }}/wwwroot -name '*.wasm' ! -name '*.wasm.gz' -exec gzip -9 -k {} \;
          find ${{ env.PUBLISH_DIR }}/wwwroot -name '*.dll' ! -name '*.dll.gz' -exec gzip -9 -k {} \;
          sudo apt-get install -y brotli
          find ${{ env.PUBLISH_DIR }}/wwwroot -name '*.wasm' ! -name '*.wasm.br' -exec brotli -q 11 -k {} \;
          find ${{ env.PUBLISH_DIR }}/wwwroot -name '*.dll' ! -name '*.dll.br' -exec brotli -q 11 -k {} \;

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PUBLISH_DIR }}/wwwroot

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
