name: DeployToGitHubPages

env:
  PROJECT_PATH: src/Hywe.Web/Hywe.Web.fsproj
  PUBLISH_DIR: src/Hywe.Web/bin/Release/net10.0/publish
  REPO_API_URL: https://api.github.com/repos/vykrum/Hywe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore workloads
        run: dotnet workload restore

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Ensure wasm-tools-net10 installed
        run: dotnet workload install wasm-tools-net10 --skip-manifest-update || true

      - name: Ensure publish dir
        run: mkdir -p ${{ env.PUBLISH_DIR }}/wwwroot

      - name: Generate sitemap and update modified timestamps
        run: |
          CURRENT_DATE=$(date -u +'%Y-%m-%d')
          CURRENT_DATETIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          echo '<?xml version="1.0" encoding="UTF-8"?>' > src/Hywe.Web/wwwroot/sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> src/Hywe.Web/wwwroot/sitemap.xml
          echo '  <url>' >> src/Hywe.Web/wwwroot/sitemap.xml
          echo '    <loc>https://hywe.in/</loc>' >> src/Hywe.Web/wwwroot/sitemap.xml
          echo "    <lastmod>${CURRENT_DATE}</lastmod>" >> src/Hywe.Web/wwwroot/sitemap.xml
          echo '  </url>' >> src/Hywe.Web/wwwroot/sitemap.xml
          echo '</urlset>' >> src/Hywe.Web/wwwroot/sitemap.xml

          sed -i -E "s/let MODIFIED_DATE = \".*\"/let MODIFIED_DATE = \"$CURRENT_DATETIME\"/g" src/Hywe.Web/Common/ModelTypes.fs
          sed -i -E "s/<meta property=\"article:modified_time\" content=\".*\" \/>/<meta property=\"article:modified_time\" content=\"$CURRENT_DATETIME\" \/>/g" src/Hywe.Web/wwwroot/index.html
          sed -i -E "s/\"dateModified\": \".*\"/\"dateModified\": \"$CURRENT_DATETIME\"/g" src/Hywe.Web/wwwroot/index.html

      - name: Publish Bolero app (Release + Trimming + AOT for GH Pages)
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} -c Release \
            -p:BlazorEnableTimeZoneSupport=false \
            -p:RunAOTCompilation=true \
            -p:PublishTrimmed=true \
            -o ${{ env.PUBLISH_DIR }}

      - name: Clean up debug symbols (.pdb)
        run: find ${{ env.PUBLISH_DIR }}/wwwroot -name "*.pdb" -type f -delete

      - name: Rewrite base href
        uses: SteveSandersonMS/ghaction-rewrite-base-href@v1
        with:
          html_path: ${{ env.PUBLISH_DIR }}/wwwroot/index.html
          base_href: /

      - name: Create CNAME file
        run: echo 'hywe.in' > ${{ env.PUBLISH_DIR }}/wwwroot/CNAME

      - name: Compress WASM and DLL files
        run: |
          find ${{ env.PUBLISH_DIR }}/wwwroot -name '*.wasm' ! -name '*.wasm.gz' -exec gzip -9 {} \;
          find ${{ env.PUBLISH_DIR }}/wwwroot -name '*.dll' ! -name '*.dll.gz' -exec gzip -9 {} \;

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PUBLISH_DIR }}/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
