name: Update Sitemap

on:
  push:
    branches: [updates]

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Generate sitemap and update modified dates
        run: |
          echo '<?xml version="1.0" encoding="UTF-8"?>' > src/Hywe.Web/wwwroot/sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> src/Hywe.Web/wwwroot/sitemap.xml
          echo '  <url>' >> src/Hywe.Web/wwwroot/sitemap.xml
          echo '    <loc>https://hywe.in/</loc>' >> src/Hywe.Web/wwwroot/sitemap.xml
          echo "    <lastmod>${{ steps.date.outputs.date }}</lastmod>" >> src/Hywe.Web/wwwroot/sitemap.xml
          echo '    <priority>1.0</priority>' >> src/Hywe.Web/wwwroot/sitemap.xml
          echo '  </url>' >> src/Hywe.Web/wwwroot/sitemap.xml
          echo '</urlset>' >> src/Hywe.Web/wwwroot/sitemap.xml

          CURRENT_DATETIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          sed -i -E "s/let MODIFIED_DATE = \".*\"/let MODIFIED_DATE = \"$CURRENT_DATETIME\"/g" src/Hywe.Web/IN-ModelTypes.fs
          sed -i -E "s/<meta property=\"article:modified_time\" content=\".*\" \/>/<meta property=\"article:modified_time\" content=\"$CURRENT_DATETIME\" \/>/g" src/Hywe.Web/wwwroot/index.html
          sed -i -E "s/\"dateModified\": \".*\"/\"dateModified\": \"$CURRENT_DATETIME\"/g" src/Hywe.Web/wwwroot/index.html

      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/Hywe.Web/wwwroot/sitemap.xml src/Hywe.Web/IN-ModelTypes.fs src/Hywe.Web/wwwroot/index.html
          git commit -m "Update sitemap.xml and modified dates [skip ci]" || echo "No changes to commit"
          git push
