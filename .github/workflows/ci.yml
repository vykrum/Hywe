name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [updates]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Build and Run Tests
        run: dotnet test tests/Hywe.Core.Tests/Hywe.Core.Tests.fsproj --configuration Release
