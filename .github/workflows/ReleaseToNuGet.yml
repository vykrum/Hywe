name: ReleaseToNuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer package version (e.g. 1.0.1 or 2026.9.26)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write  # Required for NuGet Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Determine Package Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VER="${{ github.event.inputs.version }}"
          else
            RAW_VER="${{ github.event.release.tag_name }}"
          fi

          # Strip leading 'v' or 'V' if present
          CLEAN_VER="${RAW_VER#[vV]}"

          # Normalize leading zeros in numeric components for NuGet SemVer compliance (e.g. 2026.09.26 -> 2026.9.26)
          NORMALIZED_VER=$(echo "$CLEAN_VER" | awk -F. '{ for(i=1; i<=NF; i++) { if($i ~ /^[0-9]+$/) $i=int($i) } print }' OFS=.)

          echo "Detected raw version: $RAW_VER"
          echo "Normalized version: $NORMALIZED_VER"
          echo "version=$NORMALIZED_VER" >> $GITHUB_OUTPUT

      - name: Pack Hywe.Core
        run: |
          dotnet pack src/Hywe.Core/Hywe.Core.fsproj \
            --configuration Release \
            -p:PackageVersion=${{ steps.get_version.outputs.version }} \
            --output ./artifacts

      # Authenticate via OpenID Connect (Trusted Publishing)
      # Falls back to NUGET_API_KEY secret if OIDC is not yet configured on nuget.org
      - name: NuGet OIDC Login (Trusted Publishing)
        id: nuget_oidc
        if: env.HAS_SECRET != 'true'
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || 'vykrum' }}
        continue-on-error: true
        env:
          HAS_SECRET: ${{ secrets.NUGET_API_KEY != '' }}

      - name: Push to NuGet.org
        shell: bash
        run: |
          KEY="${{ steps.nuget_oidc.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}"
          if [ -z "$KEY" ]; then
            echo "::error ::Authentication failed. Neither NuGet Trusted Publishing (OIDC) nor NUGET_API_KEY secret was resolved."
            exit 1
          fi

          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "$KEY" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      - name: Attach .nupkg to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
