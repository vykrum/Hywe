name: ReleaseToNuGet

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'create_pr'
        type: choice
        options:
          - 'create_pr'
          - 'publish_now'
      version:
        description: 'SemVer/CalVer version (e.g. 2026.11.25). Leave empty for today date'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - 'src/Hywe.Core/Hywe.Core.fsproj'
      - 'CITATION.cff'

permissions:
  contents: write
  pull-requests: write
  id-token: write  # Required for NuGet Trusted Publishing (OIDC)

jobs:
  # =========================================================================
  # Step 1: Open Release PR (Triggered via workflow_dispatch)
  # =========================================================================
  prepare_release_pr:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'create_pr'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Determine Version & Date
        id: meta
        shell: bash
        run: |
          RAW_VER="${{ github.event.inputs.version }}"
          if [ -z "$RAW_VER" ]; then
            RAW_VER=$(date -u +'%Y.%-m.%-d')
          fi

          CLEAN_VER="${RAW_VER#[vV]}"
          NORMALIZED_VER=$(echo "$CLEAN_VER" | awk -F. '{ for(i=1; i<=NF; i++) { if($i ~ /^[0-9]+$/) $i=int($i) } print }' OFS=.)
          TODAY=$(date -u +'%Y-%m-%d')

          echo "version=$NORMALIZED_VER" >> $GITHUB_OUTPUT
          echo "branch=release/v$NORMALIZED_VER" >> $GITHUB_OUTPUT
          echo "date=$TODAY" >> $GITHUB_OUTPUT

          echo "Target Version: $NORMALIZED_VER"
          echo "Release Branch: release/v$NORMALIZED_VER"

      - name: Generate Release Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="v$VERSION"

          # Generate notes via GitHub API using .github/release.yml rules
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -q .body > release_body.md 2>/dev/null || true

          # Fallback to git log if release_body is empty
          if [ ! -s release_body.md ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              echo "### Changes since $PREV_TAG" > release_body.md
              git log "$PREV_TAG..HEAD" --pretty=format:"* %s (%h)" >> release_body.md
            else
              echo "### Changes" > release_body.md
              git log -n 15 --pretty=format:"* %s (%h)" >> release_body.md
            fi
          fi

          echo "--- Generated Release Notes ---"
          cat release_body.md

      - name: Update Files (RELEASE_NOTES.md, CITATION.cff, fsproj)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TODAY: ${{ steps.meta.outputs.date }}
        shell: bash
        run: |
          # 1. Update RELEASE_NOTES.md
          python3 - <<'EOF'
          import os
          version = os.environ.get('VERSION')
          today = os.environ.get('TODAY')
          body = ""
          if os.path.exists('release_body.md'):
              with open('release_body.md', 'r', encoding='utf-8') as f:
                  body = f.read().strip()
          new_entry = f"## [{version}] — {today}\n\n{body}\n\n---\n\n"
          content = ""
          if os.path.exists('RELEASE_NOTES.md'):
              with open('RELEASE_NOTES.md', 'r', encoding='utf-8') as f:
                  content = f.read()
          marker = "---\n\n"
          idx = content.find(marker)
          if idx != -1:
              updated = content[:idx + len(marker)] + new_entry + content[idx + len(marker):]
          else:
              updated = "# Hywe.Core Release Notes\n\nAll notable changes to the `Hywe.Core` NuGet package and engine are documented in this file.\n\n---\n\n" + new_entry + content
          with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as f:
              f.write(updated)
          print(f"Updated RELEASE_NOTES.md for {version}")
          EOF

          # 2. Update CITATION.cff
          sed -i -E "s/^version: .*/version: \"$VERSION\"/" CITATION.cff
          sed -i -E "s/^date-released: .*/date-released: \"$TODAY\"/" CITATION.cff

          # 3. Update Hywe.Core.fsproj
          sed -i -E "s/<Version>.*<\/Version>/<Version>$VERSION<\/Version>/" src/Hywe.Core/Hywe.Core.fsproj

      - name: Push Release Branch and Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          BRANCH="${{ steps.meta.outputs.branch }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create branch, commit, and push
          git checkout -B "$BRANCH"
          git add CITATION.cff RELEASE_NOTES.md src/Hywe.Core/Hywe.Core.fsproj
          git diff --staged --quiet || git commit -m "chore(release): $VERSION"
          git push -f origin "$BRANCH"

          # Check if PR already exists or create new PR
          EXISTING_PR=$(gh pr list --head "$BRANCH" --base main --json url -q '.[0].url')
          if [ -n "$EXISTING_PR" ]; then
            echo "Pull request already exists: $EXISTING_PR"
            PR_URL="$EXISTING_PR"
          else
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(release): $VERSION" \
              --body-file release_body.md)
          fi

          echo "## 🚀 Release Pull Request Ready" >> $GITHUB_STEP_SUMMARY
          echo "A Pull Request for version **$VERSION** has been prepared:" >> $GITHUB_STEP_SUMMARY
          echo "- **PR Link**: $PR_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Next step**: Review and merge this PR. The merge will automatically publish to NuGet, create the release tag, and sync Zenodo." >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # Step 2: Publish Release (Triggered on Merge to main or publish_now)
  # =========================================================================
  publish:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'publish_now')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Determine Version to Publish
        id: meta
        shell: bash
        run: |
          VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" src/Hywe.Core/Hywe.Core.fsproj)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Check If Release Tag Already Exists
        id: check_release
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on repository. Skipping release."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Tag $TAG does not exist. Proceeding with publish."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Pack Hywe.Core
        if: steps.check_release.outputs.skip != 'true'
        run: |
          dotnet pack src/Hywe.Core/Hywe.Core.fsproj \
            --configuration Release \
            -p:PackageVersion=${{ steps.meta.outputs.version }} \
            --output ./artifacts

      # Authenticate via OpenID Connect (Trusted Publishing)
      - name: NuGet OIDC Login (Trusted Publishing)
        if: steps.check_release.outputs.skip != 'true'
        id: nuget_oidc
        uses: NuGet/login@v1
        with:
          user: vykrum

      - name: Push to NuGet.org
        if: steps.check_release.outputs.skip != 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget_oidc.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error ::NuGet Trusted Publishing (OIDC) did not return an API key."
            exit 1
          fi

          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      - name: Extract Release Notes for Tag
        if: steps.check_release.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          python3 - <<'EOF'
          import os
          version = os.environ.get('VERSION')
          notes = ""
          if os.path.exists('RELEASE_NOTES.md'):
              with open('RELEASE_NOTES.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              target = f"## [{version}]"
              if target in content:
                  part = content.split(target, 1)[1]
                  if "\n---\n" in part:
                      notes = part.split("\n---\n", 1)[0].strip()
                  else:
                      notes = part.split("\n## [", 1)[0].strip()
          with open('tag_notes.md', 'w', encoding='utf-8') as f:
              f.write(notes if notes else f"Release {version}")
          EOF

      - name: Create GitHub Release and Tag
        if: steps.check_release.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"

          gh release create "$TAG" \
            --title "Release $VERSION" \
            --notes-file tag_notes.md \
            ./artifacts/*.nupkg \
            ./artifacts/*.snupkg

          echo "## 🚀 Released $VERSION Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "GitHub Release **$TAG** published, NuGet package pushed, and Zenodo notified." >> $GITHUB_STEP_SUMMARY
