name: Build & Deploy API Docs

on:
  push:
    branches: [main]
    paths:
      - 'src/Hywe.Core/**'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore src/Hywe.Core/Hywe.Core.fsproj

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build fsdocs documentation
        run: |
          dotnet fsdocs build --clean \
            --projects src/Hywe.Core/Hywe.Core.fsproj \
            --parameters root https://api.hywe.in/ \
            --output output

      - name: Create CNAME file
        run: echo 'api.hywe.in' > output/CNAME

      - name: Ensure .nojekyll exists
        run: touch output/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          cname: api.hywe.in
